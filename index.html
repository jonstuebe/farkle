<html lang="en">

    <title>Farkle</title>

    <meta property="og:type" content="website" />

      property="og:description"
      content="The classic push-your-luck dice game, with real 3D dice. Pass-and-play for 1 to 8 players."

    <link rel="manifest" href="/manifest.webmanifest" />

      html,
      body {
        margin: 0;
        background: #0b0907;
        color: #f4ecd8;
      }
    </style>
